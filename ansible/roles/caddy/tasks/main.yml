---
- name: Install Caddy dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - debian-keyring
      - debian-archive-keyring
    state: present
    update_cache: true

- name: Download Caddy GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /tmp/caddy-stable-gpg.key
    force: true

- name: Add Caddy GPG key
  ansible.builtin.command:
    cmd: "gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg /tmp/caddy-stable-gpg.key"
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy Repository
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
    dest: /etc/apt/sources.list.d/caddy-stable.list
    mode: "0644"
    force: true

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Download Go
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: /tmp/go.tar.gz
  check_mode: false

- name: Install Go
  ansible.builtin.unarchive:
    src: /tmp/go.tar.gz
    dest: /usr/local
    remote_src: true
    creates: /usr/local/go/bin/go

- name: Install xcaddy
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
  environment:
    GOPATH: /tmp/go
    GOBIN: /tmp/go/bin
    GOROOT: /usr/local/go
  args:
    creates: /tmp/go/bin/xcaddy

- name: Build Caddy with plugins
  ansible.builtin.command:
    cmd: >-
      /tmp/go/bin/xcaddy build
      {% for plugin in caddy_xcaddy_plugins %}--with {{ plugin }} {% endfor %}
      --output /tmp/caddy-custom
  environment:
    GOPATH: /tmp/go
    GOBIN: /tmp/go/bin
    GOROOT: /usr/local/go
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  args:
    creates: /tmp/caddy-custom

- name: Divert original Caddy binary
  ansible.builtin.command:
    cmd: dpkg-divert --divert /usr/bin/caddy.default --rename /usr/bin/caddy
  args:
    creates: /usr/bin/caddy.default

- name: Install custom Caddy binary
  ansible.builtin.copy:
    src: /tmp/caddy-custom
    dest: /usr/bin/caddy
    remote_src: true
    mode: "0755"
  notify: restart caddy

- name: Cleanup Go and build artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/go
    - /tmp/go.tar.gz
    - /tmp/caddy-custom
    - /usr/local/go
    - /tmp/caddy-stable-gpg.key

- name: Enable Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    daemon_reload: true
