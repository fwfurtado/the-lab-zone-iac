# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_packer-lxc.yaml
  - catalog/_terraform-lxc.yaml

components:
  packer:
    lxc:
      vars:
        app_name: gitea
        files:
          "/etc/gitea/app.ini":
            source: stacks/catalog/lxc/gitea/app.ini
            args: {}

  terraform:
    garage-bucket:
      component: garage-bucket
      metadata:
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        garage_host: "10.40.1.10:3903"
        garage_admin_token: !env GARAGE_ADMIN_TOKEN
        key_name: gitea
        bucket_names:
          - gitea
          - gitea-lfs

    postgresql-database:
      component: postgresql-database
      metadata:
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        postgresql_host: "10.40.1.41"
        postgresql_admin_password: !env POSTGRES_ADMIN_PASSWORD
        database_name: gitea
        database_user: gitea
        database_password: !env GITEA_DB_PASSWORD

    lxc:
      component: lxc
      metadata:
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        proxmox_ssh_agent: !env PROXMOX_SSH_AGENT
        template_file: "components/packer/components/lxc/output/gitea-debian-bookworm-template.tar.gz"
        container:
          id: 120
          hostname: "gitea"
          description: "Gitea"
          network:
            ip_cidr: "10.40.1.20/21"
            dns:
              servers: ["1.1.1.1", "1.0.0.1"]
          tags:
            - "core"
            - "{{ .stack }}"
            - "{{ .component }}"
          image:
            repository: "gitea/gitea"
            tag: "latest"
          resources:
            cpu: 2
            memory: 2048
            disk:
              size: 10
          mount_points:
            - volume: "ssd-standard:50"
              path: "/var/lib/gitea"
              size: "50G"
              backup: true
