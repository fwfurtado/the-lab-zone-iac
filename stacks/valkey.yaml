# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_packer-lxc.yaml
  - catalog/_terraform-lxc.yaml

components:
  packer:
    lxc:
      vars:
        app_name: valkey
        ansible_extra_vars:
          valkey_password: !env VALKEY_PASSWORD

  terraform:
    lxc:
      component: lxc
      metadata:
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        proxmox_ssh_agent: !env PROXMOX_SSH_AGENT
        template_file: "components/packer/components/lxc/output/valkey-debian-bookworm-template.tar.gz"
        container:
          id: 142
          hostname: "valkey"
          description: "Valkey"
          network:
            ip_cidr: "10.40.1.42/21"
            dns:
              servers: ["1.1.1.1", "1.0.0.1"]
          tags:
            - "core"
            - "{{ .stack }}"
            - "{{ .component }}"
          image:
            repository: "valkey/valkey"
            tag: "8"
          resources:
            cpu: 2
            memory: 2048
            disk:
              size: 10
          mount_points:
            - volume: "ssd-standard:100"
              path: "/var/lib/valkey/data"
              size: "100G"
              backup: true
