# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_truenas-vm.yaml

components:
  terraform:
    truenas-vm:
      metadata:
        component: truenas-vm
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_ssh_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        vm_id: 1104
        vm_name: "truenas"
        vm_description: "TrueNAS SCALE NAS with ZFS"
        iso_path: "/home/fwfurtado/Downloads/TrueNAS-SCALE-25.10.2.1.iso"
        cpu: 2
        memory: 16384
        os_disk_size: 32
        tags:
          - "nas"
          - "truenas"
          - "storage"
