# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_packer-lxc.yaml
  - catalog/_terraform-lxc.yaml

components:
  packer:
    lxc:
      vars:
        app_name: step-ca
        ansible_extra_vars:
          step_ca_password: !env STEP_CA_PASSWORD
          step_ca_dns_name: "step-ca.infra.the-lab.zone"

  terraform:
    lxc:
      component: lxc
      metadata:
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        proxmox_ssh_agent: !env PROXMOX_SSH_AGENT
        template_file: "components/packer/components/lxc/output/step-ca-debian-bookworm-template.tar.gz"
        container:
          id: 103
          hostname: "step-ca"
          description: "Step-CA Internal Certificate Authority"
          network:
            ip_cidr: "10.40.1.3/21"
            dns:
              servers: ["1.1.1.1", "1.0.0.1"]
          tags:
            - "core"
            - "{{ .stack }}"
            - "{{ .component }}"
          image:
            repository: "smallstep/step-ca"
            tag: "latest"
          resources:
            cpu: 1
            memory: 1024
            disk:
              size: 10
          mount_points:
            - volume: "ssd-standard:10"
              path: "/var/lib/step-ca"
              size: "10G"
              backup: true
