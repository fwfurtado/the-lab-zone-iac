# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_terraform-lxc.yaml

components:
  terraform:
    garage-bucket:
      component: garage-bucket
      metadata:
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        garage_host: "10.40.1.10:3903"
        garage_admin_token: !env GARAGE_ADMIN_TOKEN
        key_name: gitea
        bucket_names:
          - gitea
          - gitea-lfs

    postgresql-database:
      component: postgresql-database
      metadata:
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        postgresql_host: "10.40.1.41"
        postgresql_admin_password: !env POSTGRES_ADMIN_PASSWORD
        database_name: gitea
        database_user: gitea
        database_password: !env GITEA_DB_PASSWORD

    lxc:
      metadata:
        component: lxc
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        proxmox_ssh_agent: !env PROXMOX_SSH_AGENT
        template_url: "http://download.proxmox.com/images/system/debian-13-standard_13.1-2_amd64.tar.zst"
        ssh_public_keys:
          - !env SSH_PUBLIC_KEY
        container:
          id: 120
          hostname: "gitea"
          description: "Gitea"
          network:
            ip_cidr: "10.40.1.20/21"
            dns:
              servers: ["10.40.1.2", "1.1.1.1", "1.0.0.1"]
          tags:
            - "core"
            - "{{ .stack }}"
            - "{{ .component }}"
          image: {}
          resources:
            cpu: 2
            memory: 2048
            disk:
              size: 10
          mount_points:
            - volume: "ssd-standard:50"
              path: "/var/lib/gitea"
              size: "50G"
              backup: true
