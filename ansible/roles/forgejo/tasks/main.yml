---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
    state: present
    update_cache: true

- name: Download Forgejo binary
  ansible.builtin.get_url:
    url: "https://codeberg.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-{{ forgejo_arch }}"
    dest: /usr/local/bin/forgejo
    mode: "0755"
  notify: restart forgejo

- name: Create forgejo group
  ansible.builtin.group:
    name: forgejo
    system: true

- name: Create forgejo user
  ansible.builtin.user:
    name: forgejo
    group: forgejo
    system: true
    shell: /bin/bash
    home: /home/forgejo
    create_home: true

- name: Create Forgejo config directory
  ansible.builtin.file:
    path: "{{ forgejo_config_dir }}"
    state: directory
    owner: forgejo
    group: forgejo
    mode: "0750"

- name: Create Forgejo data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: forgejo
    group: forgejo
    mode: "0750"
  loop:
    - "{{ forgejo_data_dir }}"
    - "{{ forgejo_data_dir }}/custom"
    - "{{ forgejo_data_dir }}/data"
    - "{{ forgejo_data_dir }}/log"
    - "{{ forgejo_data_dir }}/lfs"

- name: Create Forgejo systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/forgejo.service
    mode: "0644"
    content: |
      [Unit]
      Description=Forgejo
      After=network.target

      [Service]
      Type=simple
      User=forgejo
      Group=forgejo
      WorkingDirectory={{ forgejo_data_dir }}
      ExecStart=/usr/local/bin/forgejo web --config {{ forgejo_config_dir }}/app.ini
      Restart=on-failure
      RestartSec=5
      Environment=USER=forgejo HOME=/home/forgejo FORGEJO_WORK_DIR={{ forgejo_data_dir }}
      EnvironmentFile=-{{ forgejo_config_dir }}/env
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target
  notify: restart forgejo

- name: Enable Forgejo service
  ansible.builtin.systemd:
    name: forgejo
    enabled: true
    daemon_reload: true
