---
- name: Install htpasswd dependency
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true

- name: Download Zot release
  ansible.builtin.get_url:
    url: "https://github.com/project-zot/zot/releases/download/v{{ zot_version }}/zot-linux-{{ zot_arch }}-minimal"
    dest: /tmp/zot
    mode: "0755"
  check_mode: false

- name: Install Zot binary
  ansible.builtin.copy:
    src: /tmp/zot
    dest: /usr/local/bin/zot
    remote_src: true
    mode: "0755"
  notify: restart zot

- name: Create zot group
  ansible.builtin.group:
    name: zot
    system: true

- name: Create zot user
  ansible.builtin.user:
    name: zot
    group: zot
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Zot config directory
  ansible.builtin.file:
    path: "{{ zot_config_dir }}"
    state: directory
    owner: zot
    group: zot
    mode: "0755"

- name: Create Zot storage directory
  ansible.builtin.file:
    path: "{{ zot_data_dir }}"
    state: directory
    owner: zot
    group: zot
    mode: "0755"

- name: Generate htpasswd file
  ansible.builtin.command:
    cmd: "htpasswd -Bbn {{ zot_username }} {{ zot_password }}"
  register: htpasswd_output
  changed_when: false
  no_log: true

- name: Write htpasswd file
  ansible.builtin.copy:
    content: "{{ htpasswd_output.stdout }}\n"
    dest: "{{ zot_config_dir }}/htpasswd"
    owner: zot
    group: zot
    mode: "0600"
  no_log: true

- name: Create Zot systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/zot.service
    mode: "0644"
    content: |
      [Unit]
      Description=Zot OCI Registry
      After=network.target

      [Service]
      Type=simple
      User=zot
      Group=zot
      ExecStart=/usr/local/bin/zot serve {{ zot_config_dir }}/config.json
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target
  notify: restart zot

- name: Enable Zot service
  ansible.builtin.systemd:
    name: zot
    enabled: true
    daemon_reload: true

- name: Cleanup download artifacts
  ansible.builtin.file:
    path: /tmp/zot
    state: absent
