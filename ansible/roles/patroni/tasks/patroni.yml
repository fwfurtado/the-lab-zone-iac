---
- name: Install Patroni dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-psycopg2
      - python3-pysyncobj
    state: present

- name: Install Patroni
  ansible.builtin.pip:
    name:
      - patroni[raft]
    state: present
    extra_args: --break-system-packages

- name: Create Patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create Patroni raft data directory
  ansible.builtin.file:
    path: /var/lib/patroni/raft
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Deploy Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart patroni

- name: Deploy Patroni systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
    content: |
      [Unit]
      Description=Patroni - PostgreSQL HA
      After=network.target

      [Service]
      Type=simple
      User=postgres
      Group=postgres
      ExecStart=/usr/local/bin/patroni /etc/patroni/patroni.yml
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      TimeoutSec=30
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart patroni

- name: Enable and start Patroni
  ansible.builtin.systemd:
    name: patroni
    daemon_reload: true
    enabled: true
    state: started
