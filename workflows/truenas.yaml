workflows:
  truenas/apply:
    description: "Create/update the TrueNAS SCALE VM infrastructure"
    steps:
      - command: terraform apply truenas-vm -s truenas -auto-approve

  truenas/setup-datasets:
    description: "Create ZFS datasets on the TrueNAS pool (tank)"
    steps:
      - type: shell
        command: >-
          ssh root@10.40.1.4
          'zfs create tank/media &&
          zfs create tank/proxmox &&
          zfs create tank/backup &&
          zfs create tank/documents &&
          zfs create tank/media/movies &&
          zfs create tank/media/tv &&
          zfs create tank/media/music &&
          zfs create tank/media/photos &&
          zfs create -o compression=off tank/proxmox/aistor'

  truenas/setup-shares:
    description: "Create NFS and SMB shares on TrueNAS"
    steps:
      - type: shell
        command: >-
          ssh root@10.40.1.4
          'midclt call sharing.nfs.create '"'"'{"path": "/mnt/tank/proxmox/aistor", "networks": ["10.40.0.0/21"], "maproot_user": "root"}'"'"' &&
          midclt call sharing.smb.create '"'"'{"path": "/mnt/tank/backup", "name": "backup"}'"'"' &&
          midclt call sharing.smb.create '"'"'{"path": "/mnt/tank/documents", "name": "documents"}'"'"' &&
          midclt call sharing.smb.create '"'"'{"path": "/mnt/tank/media", "name": "media"}'"'"''
