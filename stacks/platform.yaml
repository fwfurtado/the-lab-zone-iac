# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_vm.yaml

components:
  terraform:
    talos-cluster:
      metadata:
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        talos_version: "v1.7.5"
        talos_image_platform: "nocloud"
        talos_image_architecture: "amd64"
        talos_image_extensions:
          - "siderolabs/iscsi-tools"
          - "siderolabs/qemu-guest-agent"
        cluster_endpoint: "https://10.40.1.70:6443"
        cluster:
          name: "platform"
          description: "Talos platform cluster"
          tags:
            - "platform"
            - "k8s"
            - "talos"
            - "vm"
        nodes:
          - name: "cp-1"
            id: 100
            role: "controlplane"
            cpu: 4
            memory: 16384
            disk_size: 100
            ip_cidr: "10.40.1.70/21"
            node_labels:
              topology.kubernetes.io/region: "homelab"
              topology.kubernetes.io/zone: "pve"
          - name: "worker-1"
            id: 101
            role: "worker"
            cpu: 6
            memory: 16384
            disk_size: 100
            ip_cidr: "10.40.1.71/21"
            node_labels:
              topology.kubernetes.io/region: "homelab"
              topology.kubernetes.io/zone: "pve"
          - name: "worker-2"
            id: 102
            role: "worker"
            cpu: 6
            memory: 16384
            disk_size: 100
            ip_cidr: "10.40.1.72/21"
            node_labels:
              topology.kubernetes.io/region: "homelab"
              topology.kubernetes.io/zone: "pve"
          - name: "worker-3"
            id: 103
            role: "worker"
            cpu: 6
            memory: 16384
            disk_size: 100
            ip_cidr: "10.40.1.73/21"
            node_labels:
              topology.kubernetes.io/region: "homelab"
              topology.kubernetes.io/zone: "pve"
        controlplane_config_patches:
          - |
            cluster:
              allowSchedulingOnControlPlanes: true
              network:
                cni:
                  name: none
              proxy:
                disabled: true
