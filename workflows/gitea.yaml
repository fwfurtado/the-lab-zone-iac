workflows:
  gitea/apply:
    description: "Create/update the Gitea container infrastructure"
    steps:
      - command: terraform apply garage-bucket -s gitea -auto-approve
      - command: terraform apply postgresql-database -s gitea -auto-approve
      - command: terraform apply lxc -s gitea -auto-approve

  gitea/configure:
    description: "Configure Gitea on the running container via Ansible"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit gitea
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  gitea/drift:
    description: "Check configuration drift on the Gitea container"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit gitea
          --check --diff
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  gitea/deploy-config:
    description: "Deploy Gitea config and secrets to the running container"
    steps:
      - type: shell
        command: >-
          op inject -i stacks/catalog/lxc/gitea/app.ini -o /tmp/gitea-app.ini
      - type: shell
        command: >-
          scp
          /tmp/gitea-app.ini
          ${PROXMOX_SSH_USERNAME}@${PROXMOX_SSH_HOST}:/tmp/
      - type: shell
        command: >-
          ssh ${PROXMOX_SSH_USERNAME}@${PROXMOX_SSH_HOST}
          "sudo pct push 120 /tmp/gitea-app.ini /etc/gitea/app.ini --perms 0640
          && sudo pct exec 120 -- chown git:git /etc/gitea/app.ini
          && sudo pct exec 120 -- systemctl restart gitea
          && rm -f /tmp/gitea-app.ini"
      - type: shell
        command: >-
          rm -f /tmp/gitea-app.ini
