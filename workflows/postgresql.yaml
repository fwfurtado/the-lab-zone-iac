workflows:
  postgresql/apply:
    description: "Create/update the PostgreSQL container infrastructure"
    steps:
      - command: terraform apply lxc -s postgresql -auto-approve

  postgresql/configure:
    description: "Configure PostgreSQL on the running container via Ansible"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit postgresql
          -e postgres_major_version=${POSTGRES_MAJOR_VERSION}
          -e postgres_admin_password=${POSTGRES_ADMIN_PASSWORD}
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  postgresql/provision:
    description: "Create databases and roles on the PostgreSQL server"
    steps:
      - command: terraform apply postgresql-database -s postgresql -auto-approve

  postgresql/drift:
    description: "Check configuration drift on the PostgreSQL container"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit postgresql
          --check --diff
          -e postgres_major_version=${POSTGRES_MAJOR_VERSION}
          -e postgres_admin_password=${POSTGRES_ADMIN_PASSWORD}
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}
