APP_NAME = Forgejo
RUN_USER = forgejo
RUN_MODE = prod
WORK_PATH = /var/lib/forgejo

[server]
PROTOCOL = http
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = https://forgejo.the-lab.zone/
SSH_DOMAIN = git.forgejo.the-lab.zone
SSH_PORT = 22
LFS_START_SERVER = true

[database]
DB_TYPE = postgres
HOST = 10.40.1.41:5432
NAME = forgejo
USER = forgejo
PASSWD = {{ op://homelab/Forgejo Database/password }}
SSL_MODE = disable

[storage]
STORAGE_TYPE = minio
MINIO_ENDPOINT = 10.40.1.11:3900
MINIO_BUCKET = forgejo
MINIO_LOCATION = garage
MINIO_USE_SSL = false
MINIO_ACCESS_KEY_ID = {{ op://homelab/Forgejo Garage S3/access-key-id }}
MINIO_SECRET_ACCESS_KEY = {{ op://homelab/Forgejo Garage S3/secret-access-key }}

[lfs]
STORAGE_TYPE = minio
MINIO_ENDPOINT = 10.40.1.11:3900
MINIO_BUCKET = forgejo-lfs
MINIO_LOCATION = garage
MINIO_USE_SSL = false
MINIO_ACCESS_KEY_ID = {{ op://homelab/Forgejo Garage S3/access-key-id }}
MINIO_SECRET_ACCESS_KEY = {{ op://homelab/Forgejo Garage S3/secret-access-key }}

[security]
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true

[openid]
ENABLE_OPENID_SIGNIN = false

[log]
MODE = file
LEVEL = info
ROOT_PATH = /var/lib/forgejo/log
