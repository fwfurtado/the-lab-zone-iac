# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_terraform-lxc.yaml

components:
  terraform:
    garage-bucket:
      component: garage-bucket
      metadata:
        terraform_workspace: "{{ .stack }}-{{ .component }}"
      vars:
        garage_host: "10.40.1.11:3903"
        garage_admin_token: !env GARAGE_ADMIN_TOKEN
        nodes:
          - id: !env GARAGE_NODE_ID
            zone: "dc1"
            capacity: "100G"
        keys:
          gitea:
            bucket_names: ["gitea", "gitea-lfs"]
          forgejo:
            bucket_names: ["forgejo", "forgejo-lfs"]
          assets:
            bucket_names: ["assets"]
        buckets:
          gitea:
            website: false
          gitea-lfs:
            website: false
          forgejo:
            website: false
          forgejo-lfs:
            website: false
          assets:
            website: true

    lxc:
      metadata:
        component: lxc
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        proxmox_ssh_agent: !env PROXMOX_SSH_AGENT
        template_url: "http://download.proxmox.com/images/system/debian-13-standard_13.1-2_amd64.tar.zst"
        ssh_public_keys:
          - !env SSH_PUBLIC_KEY
        container:
          id: 111
          hostname: "garage"
          description: "Garage S3"
          network:
            ip_cidr: "10.40.1.11/21"
            dns:
              servers: ["10.40.1.2", "1.1.1.1", "1.0.0.1"]
          tags:
            - "core"
            - "{{ .stack }}"
            - "{{ .component }}"
          image: {}
          resources:
            cpu: 2
            memory: 2048
            disk:
              size: 10
          mount_points:
            - volume: "ssd-standard:100"
              path: "/var/lib/garage/data"
              size: "100G"
              backup: true
