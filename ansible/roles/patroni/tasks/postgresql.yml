---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - acl
    state: present
    update_cache: true

- name: Add PostgreSQL signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/postgresql-archive-keyring.asc
    mode: "0644"

- name: Add PostgreSQL repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.asc]
      https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main
    filename: pgdg
    state: present

- name: Install PostgreSQL {{ pg_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
    state: present
    update_cache: true

- name: Stop and disable default PostgreSQL service
  ansible.builtin.systemd:
    name: "postgresql"
    enabled: false
    state: stopped

- name: Set ownership on data mount
  ansible.builtin.file:
    path: "{{ pg_data_mount }}"
    owner: postgres
    group: postgres
    mode: "0700"
    recurse: true
