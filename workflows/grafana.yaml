workflows:
  grafana/apply:
    description: "Create/update the Grafana container infrastructure"
    steps:
      - command: terraform apply lxc -s grafana -auto-approve

  grafana/configure:
    description: "Configure Grafana on the running container via Ansible"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit grafana
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  grafana/drift:
    description: "Check configuration drift on the Grafana container"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit grafana
          --check --diff
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  grafana/deploy-config:
    description: "Deploy Grafana config and secrets to the running container"
    steps:
      - type: shell
        command: >-
          op inject -i stacks/catalog/lxc/grafana/env.tpl -o /tmp/grafana-env
      - type: shell
        command: >-
          scp
          stacks/catalog/lxc/grafana/grafana.ini
          /tmp/grafana-env
          ${PROXMOX_SSH_USERNAME}@${PROXMOX_SSH_HOST}:/tmp/
      - type: shell
        command: >-
          ssh ${PROXMOX_SSH_USERNAME}@${PROXMOX_SSH_HOST}
          "sudo pct push 1150 /tmp/grafana.ini /etc/grafana/grafana.ini --perms 0640
          && sudo pct push 1150 /tmp/grafana-env /etc/grafana/env --perms 0640
          && sudo pct exec 1150 -- chown grafana:grafana /etc/grafana/grafana.ini /etc/grafana/env
          && sudo pct exec 1150 -- systemctl daemon-reload
          && sudo pct exec 1150 -- systemctl restart grafana-server
          && rm -f /tmp/grafana.ini /tmp/grafana-env"
      - type: shell
        command: >-
          rm -f /tmp/grafana-env
