metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

replication_factor = 1

rpc_secret = "{{ tpl_args.rpc_secret }}"
rpc_bind_addr = "[::]:3901"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.infra.the-lab.zone"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.the-lab.zone"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "{{ tpl_args.admin_token }}"
