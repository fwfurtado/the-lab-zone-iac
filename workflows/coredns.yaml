workflows:
  coredns/apply:
    description: "Create/update the CoreDNS container infrastructure"
    steps:
      - command: terraform apply lxc -s coredns -auto-approve

  coredns/configure:
    description: "Configure CoreDNS on the running container via Ansible"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit coredns
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  coredns/drift:
    description: "Check configuration drift on the CoreDNS container"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit coredns
          --check --diff
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  coredns/deploy-zone:
    description: "Deploy the BIND zone file to the running container and reload CoreDNS"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit coredns
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}
          --tags zone
