workflows:
  valkey/apply:
    description: "Create/update the Valkey container infrastructure"
    steps:
      - command: terraform apply lxc -s valkey -auto-approve

  valkey/configure:
    description: "Configure Valkey on the running container via Ansible"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit valkey
          -e valkey_password=${VALKEY_PASSWORD}
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  valkey/drift:
    description: "Check configuration drift on the Valkey container"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit valkey
          --check --diff
          -e valkey_password=${VALKEY_PASSWORD}
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}
