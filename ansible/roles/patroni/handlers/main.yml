---
- name: restart patroni
  ansible.builtin.systemd:
    name: patroni
    state: restarted
    daemon_reload: true

- name: restart pgbouncer
  ansible.builtin.systemd:
    name: pgbouncer
    state: restarted

- name: reload pgbouncer
  ansible.builtin.systemd:
    name: pgbouncer
    state: reloaded
