# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_packer-lxc.yaml
  - catalog/_terraform-lxc.yaml

components:
  packer:
    lxc:
      vars:
        app_name: postgresql
        ansible_extra_vars:
          postgres_major_version: !env POSTGRES_MAJOR_VERSION
          postgres_admin_password: !env POSTGRES_ADMIN_PASSWORD

  terraform:
    lxc:
      component: lxc
      metadata:
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        proxmox_ssh_agent: !env PROXMOX_SSH_AGENT
        template_file: "components/packer/components/lxc/output/postgresql-debian-bookworm-template.tar.gz"
        container:
          id: 141
          hostname: "postgresql"
          description: "PostgreSQL"
          network:
            ip_cidr: "10.40.1.41/21"
            dns:
              servers: ["1.1.1.1", "1.0.0.1"]
          tags:
            - "core"
            - "{{ .stack }}"
            - "{{ .component }}"
          image:
            repository: "postgres"
            tag: "18"
          resources:
            cpu: 2
            memory: 4096
            disk:
              size: 10
          mount_points:
            - volume: "ssd-standard:100"
              path: "/var/lib/postgresql/data"
              size: "100G"
              backup: true
