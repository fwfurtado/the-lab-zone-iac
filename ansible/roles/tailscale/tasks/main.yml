---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add Tailscale signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
    filename: tailscale
    state: present

- name: Install tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    reload: true
    state: present
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Enable tailscaled for boot
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Authenticate and configure Tailscale
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ ts_auth_key }}
      --hostname={{ ts_host }}
      --advertise-routes={{ ts_routes }}
  when: ts_status.rc != 0 or (ts_status.stdout | from_json).BackendState != "Running"
  no_log: true
