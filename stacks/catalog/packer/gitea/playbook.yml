# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible-community/ansible-lint/schemas/src/ansiblelint/f/ansible-playbook-schema.json
---
- hosts: localhost
  become: true
  vars:
    gitea_version: "1.23.4"
    gitea_arch: "amd64"
  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name: ["ca-certificates", "curl", "git"]
        state: present
        update_cache: true

    - name: Download Gitea binary
      ansible.builtin.get_url:
        url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-{{ gitea_arch }}"
        dest: /usr/local/bin/gitea
        mode: "0755"

    - name: Create git group
      ansible.builtin.group:
        name: git
        system: true

    - name: Create git user
      ansible.builtin.user:
        name: git
        group: git
        system: true
        shell: /bin/bash
        home: /home/git
        create_home: true

    - name: Create Gitea config directory
      ansible.builtin.file:
        path: /etc/gitea
        state: directory
        owner: git
        group: git
        mode: "0750"

    - name: Create Gitea data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: git
        group: git
        mode: "0750"
      loop:
        - /var/lib/gitea
        - /var/lib/gitea/custom
        - /var/lib/gitea/data
        - /var/lib/gitea/log
        - /var/lib/gitea/lfs

    - name: Create Gitea systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/gitea.service
        mode: "0644"
        content: |
          [Unit]
          Description=Gitea (Git with a cup of tea)
          After=network.target

          [Service]
          Type=simple
          User=git
          Group=git
          WorkingDirectory=/var/lib/gitea
          ExecStart=/usr/local/bin/gitea web --config /etc/gitea/app.ini
          Restart=on-failure
          RestartSec=5
          Environment=USER=git HOME=/home/git GITEA_WORK_DIR=/var/lib/gitea
          EnvironmentFile=-/etc/gitea/env
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target

    - name: Enable Gitea service
      ansible.builtin.systemd:
        name: gitea
        enabled: true
        daemon_reload: true

    - name: Read packer files JSON
      ansible.builtin.command:
        cmd: cat /tmp/packer-files.json
      register: packer_files_raw
      changed_when: false

    - name: Parse packer files
      ansible.builtin.set_fact:
        packer_files: "{{ (packer_files_raw.stdout | from_json).packer_files }}"

    - name: Create directories for Packer files
      ansible.builtin.file:
        path: "{{ item.key | dirname }}"
        state: directory
        owner: git
        group: git
        mode: "0750"
      loop: "{{ packer_files | dict2items }}"

    - name: Write Packer files (static content)
      ansible.builtin.copy:
        content: "{{ item.value.content }}"
        dest: "{{ item.key }}"
        owner: git
        group: git
        mode: "0640"
        force: true
      loop: "{{ packer_files | dict2items }}"
      when: (item.value.args | default({}) | length) == 0

    - name: Write template to temp file for rendering
      ansible.builtin.copy:
        content: "{{ item.value.content }}"
        dest: "/tmp/packer-tpl-{{ item.key | hash('md5') }}.j2"
        mode: "0644"
        force: true
      loop: "{{ packer_files | dict2items }}"
      when: (item.value.args | default({}) | length) > 0

    - name: Render Packer template files
      ansible.builtin.template:
        src: "/tmp/packer-tpl-{{ item.key | hash('md5') }}.j2"
        dest: "{{ item.key }}"
        owner: git
        group: git
        mode: "0640"
        force: true
      vars:
        tpl_args: "{{ item.value.args | default({}) }}"
      loop: "{{ packer_files | dict2items }}"
      when: (item.value.args | default({}) | length) > 0
