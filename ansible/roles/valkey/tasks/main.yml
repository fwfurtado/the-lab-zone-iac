---
- name: Install Valkey
  ansible.builtin.apt:
    name:
      - valkey-server
      - valkey-tools
    state: present
    update_cache: true

- name: Ensure Valkey data directory exists
  ansible.builtin.file:
    path: "{{ valkey_data_dir }}"
    state: directory
    owner: valkey
    group: valkey
    mode: "0750"

- name: Configure Valkey to bind on all interfaces
  ansible.builtin.lineinfile:
    path: "{{ valkey_conf }}"
    regexp: "^#?\\s*bind\\s+"
    line: "bind 0.0.0.0"
    create: false
  notify: restart valkey

- name: Configure Valkey data directory
  ansible.builtin.lineinfile:
    path: "{{ valkey_conf }}"
    regexp: "^#?\\s*dir\\s+"
    line: "dir {{ valkey_data_dir }}"
    create: false
  notify: restart valkey

- name: Enable AOF persistence
  ansible.builtin.lineinfile:
    path: "{{ valkey_conf }}"
    regexp: "^#?\\s*appendonly\\s+"
    line: "appendonly yes"
    create: false
  notify: restart valkey

- name: Set Valkey password when provided
  ansible.builtin.lineinfile:
    path: "{{ valkey_conf }}"
    regexp: "^#?\\s*requirepass\\s+"
    line: "requirepass {{ valkey_password }}"
    create: false
  no_log: true
  when:
    - valkey_password is defined
    - valkey_password | length > 0
  notify: restart valkey

- name: Configure protected-mode
  ansible.builtin.lineinfile:
    path: "{{ valkey_conf }}"
    regexp: "^#?\\s*protected-mode\\s+"
    line: "protected-mode yes"
    create: false
  notify: restart valkey

- name: Ensure Valkey service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/valkey-server.service.d
    state: directory
    mode: "0755"

- name: Install Valkey service override for data permissions
  ansible.builtin.copy:
    dest: /etc/systemd/system/valkey-server.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      ExecStartPre=+/bin/mkdir -p {{ valkey_data_dir }}
      ExecStartPre=+/bin/chown -R valkey:valkey {{ valkey_data_dir }}
      ExecStartPre=+/bin/chmod 0750 {{ valkey_data_dir }}
  notify: restart valkey

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Valkey service is enabled and started
  ansible.builtin.systemd:
    name: valkey-server
    enabled: true
    state: started
