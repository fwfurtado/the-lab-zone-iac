---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana-gpg.key
    mode: "0644"
  check_mode: false

- name: Dearmor and install Grafana GPG key
  ansible.builtin.shell:
    cmd: gpg --dearmor < /tmp/grafana-gpg.key > /usr/share/keyrings/grafana.gpg
    creates: /usr/share/keyrings/grafana.gpg

- name: Add Grafana repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    mode: "0644"
    content: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main\n"

- name: Install Grafana OSS
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Ensure Grafana config directory exists
  ansible.builtin.file:
    path: "{{ grafana_config_dir }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"

- name: Ensure Grafana data directory exists
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"

- name: Create systemd override directory for Grafana
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: Add systemd override to load custom env file
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      EnvironmentFile=-{{ grafana_config_dir }}/env
  notify: restart grafana-server

- name: Enable Grafana service
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    daemon_reload: true
