# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

import:
  - catalog/_patroni-vm.yaml

components:
  terraform:
    patroni-vm:
      metadata:
        component: patroni-vm
        terraform_workspace: "{{ .stack }}"
      vars:
        proxmox_node_name: !env PROXMOX_SSH_NODE_NAME
        proxmox_ssh_host: !env PROXMOX_SSH_HOST
        proxmox_ssh_username: !env PROXMOX_SSH_USERNAME
        ssh_public_keys:
          - !env SSH_PUBLIC_KEY
        vm_id: 1175
        vm_name: "patroni-pg"
        vm_description: "Patroni HA PostgreSQL 16 with PgBouncer and PgBackRest"
        ip_cidr: "10.40.1.75/21"
        cpu: 4
        memory: 8192
        os_disk_size: 20
        data_disk_size: 100
        tags:
          - "database"
          - "patroni"
          - "postgresql"
