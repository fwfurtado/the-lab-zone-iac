workflows:
  forgejo/apply:
    description: "Create/update the Forgejo container infrastructure"
    steps:
      - command: terraform apply lxc -s forgejo -auto-approve

  forgejo/configure:
    description: "Configure Forgejo on the running container via Ansible"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit forgejo
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  forgejo/drift:
    description: "Check configuration drift on the Forgejo container"
    steps:
      - type: shell
        command: >-
          cd ansible && ansible-playbook playbooks/configure.yml
          --limit forgejo
          --check --diff
          -e step_ca_url=${STEP_CA_URL}
          -e step_ca_fingerprint=${STEP_CA_FINGERPRINT}

  forgejo/deploy-config:
    description: "Deploy Forgejo config and secrets to the running container"
    steps:
      - type: shell
        command: >-
          op inject -i stacks/catalog/lxc/forgejo/app.ini -o /tmp/forgejo-app.ini
      - type: shell
        command: >-
          scp /tmp/forgejo-app.ini root@10.40.1.22:/etc/forgejo/app.ini
      - type: shell
        command: >-
          ssh root@10.40.1.22
          "chown forgejo:forgejo /etc/forgejo/app.ini
          && chmod 0640 /etc/forgejo/app.ini
          && systemctl restart forgejo"
      - type: shell
        command: >-
          rm -f /tmp/forgejo-app.ini

  forgejo/create-admin:
    description: "Create the initial Forgejo admin user"
    steps:
      - type: shell
        command: >-
          ssh root@10.40.1.22
          "su -s /bin/bash forgejo -c 'forgejo admin user create
          --admin
          --username ${FORGEJO_ADMIN_USERNAME}
          --password ${FORGEJO_ADMIN_PASSWORD}
          --email ${FORGEJO_ADMIN_EMAIL}
          --config /etc/forgejo/app.ini'"
