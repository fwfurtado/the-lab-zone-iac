---
# Full backup - Sunday 01:00
- name: Deploy full backup service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pgbackrest-full.service
    mode: "0644"
    content: |
      [Unit]
      Description=PgBackRest Full Backup

      [Service]
      Type=oneshot
      User=postgres
      ExecStart=/usr/bin/pgbackrest --stanza={{ pgbackrest_stanza }} --type=full backup
      IOSchedulingClass=idle
      Nice=19

- name: Deploy full backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/pgbackrest-full.timer
    mode: "0644"
    content: |
      [Unit]
      Description=PgBackRest Full Backup Schedule

      [Timer]
      OnCalendar=Sun *-*-* 01:00:00
      Persistent=true
      RandomizedDelaySec=300

      [Install]
      WantedBy=timers.target

- name: Enable full backup timer
  ansible.builtin.systemd:
    name: pgbackrest-full.timer
    daemon_reload: true
    enabled: true
    state: started

